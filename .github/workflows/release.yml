name: Saddle Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Saddle with Sable upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify overlay
        run: bash scripts/verify.sh

      - name: Build
        run: bash scripts/build.sh

      - name: Verify release artifact
        run: |
          set -euo pipefail
          test -f dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar
          unzip -p dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar META-INF/neoforge.mods.toml | grep -q 'modId = "sable"'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar