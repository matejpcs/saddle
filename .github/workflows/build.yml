name: Saddle Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Saddle with Sable upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify overlay
        run: bash scripts/verify.sh

      - name: Build
        run: bash scripts/build.sh

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar
          unzip -p dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar META-INF/neoforge.mods.toml | grep -q 'modId = "sable"'
          unzip -p dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar META-INF/neoforge.mods.toml | grep -q 'displayName = "Saddle"'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: saddle-neoforge-1.21.1
          path: dist/saddle-neoforge-1.21.1-2.0.5-saddle.1.jar
          if-no-files-found: error